[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "agent-security-lab"
version = "0.1.0"
description = "Local, source-locked security portfolio demonstrations"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []
[project.scripts]
security-lab = "agent_security_lab.cli:main"
[dependency-groups]
dev = ["ruff>=0.16.9,<0.17"]
docs = ["zensical>=0.0.65,<0.1"]
[tool.hatch.build.targets.wheel]
packages = ["src/agent_security_lab"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
